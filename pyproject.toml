[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: tests that require a live or externally managed service",
  "polar: tests that require a Polar Lightning test network",
  "slow: long-running scenario or tournament tests",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".venv",
  ".worktrees",
  "vendor",
  "results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
]
